spring.application.name=job-portal-backend
server.port=${PORT:4040}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jackson.serialization.fail-on-empty-beans=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-3.8-flash}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.com.jobportal=INFO
logging.level.org.springframework.web=DEBUG